<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk - Toko Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <nav class="bg-white shadow-md sticky top-0 z-50">
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <a href="index.html" class="text-2xl font-bold text-indigo-600"
          >Toko Modern</a
        >
        <div class="hidden md:flex space-x-6">
          <a href="index.html" class="text-gray-600 hover:text-indigo-600"
            >Home</a
          >
          <a href="products.html" class="text-indigo-600 font-semibold"
            >Produk</a
          >
          <a href="cart.html" class="text-gray-600 hover:text-indigo-600"
            >Keranjang</a
          >
        </div>
        <a
          href="cart.html"
          class="text-gray-600 hover:text-indigo-600 md:hidden"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l3.293 3.293A1 1 0 009.5 7h8a1 1 0 00.9-.5l2.4-5.278A1 1 0 0021 3H3zM10 21a1 1 0 11-2 0 1 1 0 012 0zm10 0a1 1 0 11-2 0 1 1 0 012 0z"
            ></path>
          </svg>
        </a>
      </div>
    </nav>

    <main class="container mx-auto px-4 py-10">
      <h1 class="text-4xl font-bold mb-8 text-center">Semua Produk</h1>

      <div class="md:flex md:space-x-8 mb-8">
        <div class="mb-4 md:mb-0 w-full md:w-1/4">
          <h3 class="font-bold text-xl mb-3">Filter Kategori</h3>
          <select class="w-full p-2 border border-gray-300 rounded-md">
            <option>Semua Kategori</option>
            <option>Pakaian</option>
            <option>Aksesoris</option>
            <option>Elektronik</option>
          </select>
        </div>

        <div class="w-full md:w-3/4">
          <h3 class="font-bold text-xl mb-3">Cari Produk</h3>
          <input
            type="text"
            placeholder="Masukkan nama produk..."
            class="w-full p-2 border border-gray-300 rounded-md"
          />
        </div>
      </div>

      <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
        <div
          class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition"
        >
          <div class="h-48 bg-gray-200"></div>
          <div class="p-4">
            <h3 class="font-bold text-lg">Nama Produk X</h3>
            <p class="text-indigo-600 font-semibold mt-1">Rp 150.000</p>
            <p class="text-sm text-gray-500">Kategori: Pakaian</p>
            <a
              href="detail.html"
              class="mt-4 block text-center bg-indigo-500 text-white py-2 rounded-md hover:bg-indigo-600"
              >Lihat Detail</a
            >
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-10">
      <div class="container mx-auto px-4 text-center">
        <p>&copy; 2025 Toko Modern. Semua Hak Dilindungi.</p>
      </div>
    </footer>
  </body>
</html>
